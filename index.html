<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jet d'Eau · Genève</title>
<style>
:root{--fg:#10263d;--mut:#4d6781;--panel:rgba(255,255,255,.88);--acc:#1a73c8;--line:rgba(0,0,0,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#eaf4ff;--mut:#9db4cc;--panel:rgba(8,20,36,.86);--acc:#5cc8ff;--line:rgba(255,255,255,.16)}}
:root[data-theme="dark"]{--fg:#eaf4ff;--mut:#9db4cc;--panel:rgba(8,20,36,.86);--acc:#5cc8ff;--line:rgba(255,255,255,.16)}
html,body{height:100%;margin:0;background:#0c2140;overflow:hidden;font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg)}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
#zoom{position:fixed;right:8px;top:calc(122px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;font:18px system-ui;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
#hud,#panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud{top:calc(8px + env(safe-area-inset-top,0px));left:8px;padding:8px 10px;display:grid;grid-template-columns:auto auto;gap:2px 14px}
#hud div{white-space:nowrap}#hud b{font-variant-numeric:tabular-nums}#hud span{color:var(--mut)}
#panel{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:8px 10px;max-width:760px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-left:6px;cursor:pointer}
.body{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px}
#panel.folded .body{display:none}
label{display:block;min-width:0}label span{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
label span b{color:var(--fg)}
input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--acc);height:28px}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (max-width:600px){#hud{font-size:11px;padding:5px 8px;gap:0 10px;border-radius:10px}
#panel{padding:5px 8px;left:6px;right:6px}.body{gap:0 10px}label span{font-size:11px}input[type=range]{height:22px}.bar button{padding:3px 9px}.bar>b{display:none}.bar{justify-content:flex-end}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
<div><span>Caudal</span> <b id="h_q">–</b></div><div><span>Potencia</span> <b id="h_p">–</b></div>
<div><span>Salida</span> <b id="h_v">–</b></div><div><span>Altura</span> <b id="h_h">–</b></div>
<div><span>Boquilla Ø</span> <b id="h_d">–</b></div><div><span>En el aire</span> <b id="h_m">–</b></div>
</div>
<div id="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zrst">⌖</button></div>
<div id="panel">
<div class="bar"><b>Jet d'Eau · Genève</b><span><button id="par" style="opacity:.5">Trayect.</button><button id="real">Real</button><button id="pause">⏸</button><button id="fold">▾</button></span></div>
<div class="body">
<label><span>Caudal <b><i id="v_q">500</i> L/s</b></span><input type="range" id="q" min="150" max="1000" step="10" value="500"></label>
<label><span>Potencia bombas <b><i id="v_pw">1000</i> kW</b></span><input type="range" id="pw" min="300" max="2000" step="10" value="1000"></label>
<label><span>Viento <b><i id="v_wind">10</i> m/s</b></span><input type="range" id="wind" min="0" max="35" step="0.5" value="10"></label>
<label><span>Viento desde <b><i id="v_dir">270° O</i></b></span><input type="range" id="dir" min="0" max="359" step="1" value="270"></label>
<label><span>Turbulencia <b><i id="v_turb">1.0</i> ×</b></span><input type="range" id="turb" min="0" max="2" step="0.1" value="1"></label>
<label><span>Ráfagas <b><i id="v_gust">0</i> %</b></span><input type="range" id="gust" min="0" max="60" step="5" value="0"></label>
</div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),bg=document.createElement('canvas'),panel=$('panel');
const G=9.81,ETA=.76,RHO=1000,K0=.0007,D0=.108,N=40000,CP=.995,SPH=.0998;
const T={q:500,pw:1000,wind:10,dir:270,turb:1,gust:0};
const WG=2.5;let showPar=false;   // WG: la niebla y las gotas sienten más el viento lateral   // objetivos (sliders)
const S={q:500,pw:1000};                                 // valores reales (la bomba tarda en responder)
const X=new Float32Array(N),Y=new Float32Array(N),Z=new Float32Array(N),
 VX=new Float32Array(N),VY=new Float32Array(N),VZ=new Float32Array(N),
 K=new Float32Array(N),AGE=new Float32Array(N),M=new Float32Array(N),A=new Uint8Array(N);
let ux=0,uy=0,yaw=0,pit=.1,zm=1,panX=0,panY=0,mf=1,W,H,dpr,baseY,cx,s=0,head=0,acc=0,tm=0,qa=1,alive=0,rate=700,paused=false;
let wind={E:0,N:0,v:0};
const spl=[];
const g=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;  // ~N(0,1) barata

// Física de salida: potencia cinética = ETA*P = 1/2 rho Q v^2  ->  v ; área = Q/v ; altura con arrastre cuadrático
function derive(Qls,Pkw){
  const q=Qls/1000,v=Math.sqrt(2*ETA*Pkw*1000/(RHO*q)),d=Math.sqrt(4*q/(Math.PI*v));
  const k=K0*D0/d,h=Math.log(1+k*v*v/G)/(2*k);
  return{q,v,d,k,h};
}
function emit(n,dv,dt){
  for(let i=0;i<n;i++){
    const j=head;head=(head+1)%N;
    const q=Math.random(),m=q<.28?.1+Math.random()*.4:q<.8?.5+Math.random()*.55:1.05+Math.random()*1.2; // niebla fina, núcleo y gotas grandes
    const r=dv.d/2*Math.sqrt(Math.random()),a=Math.random()*6.2832;
    const tilt=Math.abs(g())*.007*T.turb,ang=Math.random()*6.2832;
    const sp=dv.v*(1+.012*g()*T.turb+.008*Math.sin(tm*2.2));
    VX[j]=sp*Math.sin(tilt)*Math.cos(ang);VZ[j]=sp*Math.sin(tilt)*Math.sin(ang);VY[j]=sp*Math.cos(tilt);
    const u=Math.random()*dt;
    X[j]=r*Math.cos(a)+VX[j]*u;Z[j]=r*Math.sin(a)+VZ[j]*u;Y[j]=VY[j]*u;
    K[j]=dv.k/m;M[j]=m;AGE[j]=u;A[j]=1;
  }
}
function traj(dv,m,cb){   // trayectoria media sin turbulencia (la parábola con arrastre y viento)
  let x=0,y=0,z=0,vx=0,vy=dv.v,vz=0;const k=dv.k/m,dt=.03;cb(0,0,0);
  for(let n=0;n<900;n++){
    const ws=wind.v*Math.pow(Math.max(y,1)/10,.22),rx=vx-ws*wind.E,rz=vz-ws*wind.N,kk=k*Math.sqrt(rx*rx+vy*vy+rz*rz);
    vx+=-kk*WG*rx*dt;vz+=-kk*WG*rz*dt;vy+=(-G-kk*vy)*dt;x+=vx*dt;y+=vy*dt;z+=vz*dt;
    if(y<0)break;cb(x,y,z);
  }
}
function step(dt,dv){
  const Tref=dv.v/G*.9,ang=T.dir*Math.PI/180;
  const gf=1+T.gust/100*(.6*Math.sin(tm*.7)+.4*Math.sin(tm*1.9+1));
  const wv=T.wind*gf,wE=-Math.sin(ang),wN=-Math.cos(ang),sq=Math.sqrt(dt);
  wind={E:wE,N:wN,v:wv};
  alive=0;
  for(let i=0;i<N;i++){
    if(!A[i])continue;
    const ws=wv*Math.pow(Math.max(Y[i],1)/10,.22);      // viento aumenta con la altura
    const rx=VX[i]-ws*wE,ry=VY[i],rz=VZ[i]-ws*wN;
    const kk=K[i]*Math.sqrt(rx*rx+ry*ry+rz*rz);
    const u=Math.min(1,AGE[i]/Tref);
    const sg=T.turb*(.06+2*u*u)*Math.min(2,Math.max(.7,.5/Math.sqrt(M[i])))*sq; // la turbulencia crece hacia arriba
    VX[i]+=-kk*WG*rx*dt+sg*g();VZ[i]+=-kk*WG*rz*dt+sg*g();VY[i]+=(-G-kk*ry)*dt+sg*.5*g();
    X[i]+=VX[i]*dt;Y[i]+=VY[i]*dt;Z[i]+=VZ[i]*dt;AGE[i]+=dt;
    if(Y[i]<0){A[i]=0;if(spl.length<400&&Math.random()<.04)spl.push([X[i],Z[i],1]);continue;}
    alive++;
  }
  for(let i=spl.length-1;i>=0;i--){spl[i][2]-=dt*1.2;if(spl[i][2]<=0){spl[i]=spl[spl.length-1];spl.pop();}}
}
function buildBG(){
  baseY=H-(panel.offsetHeight||0)-Math.min(30,H*.04)-8;cx=W/2;
  const hor=baseY-Math.max(34,H*.05);
  bg.width=W*1.8*dpr;bg.height=H*dpr;const b=bg.getContext('2d');b.setTransform(dpr,0,0,dpr,0,0);
  let gr=b.createLinearGradient(0,0,0,hor);
  gr.addColorStop(0,'#0c2140');gr.addColorStop(.55,'#35618f');gr.addColorStop(1,'#f2b88c');
  b.fillStyle=gr;b.fillRect(0,0,W*1.8,hor+1);
  const ridge=(col,amp,base,sd)=>{b.fillStyle=col;b.beginPath();b.moveTo(0,hor+1);
    for(let x=0;x<=W*1.8+8;x+=8){const y=hor-(base+amp*(.5*Math.sin(x*.003+sd)+.3*Math.sin(x*.009+sd*2)+.2*Math.sin(x*.021+sd*3)+.5));b.lineTo(x,y);}
    b.lineTo(W*1.8,hor+1);b.fill();};
  ridge('#6b86a8',H*.06,H*.03,1.3);ridge('#2c4764',H*.045,H*.008,4.1);
  gr=b.createLinearGradient(0,hor,0,H);
  gr.addColorStop(0,'#d79c80');gr.addColorStop(.12,'#3b6a92');gr.addColorStop(1,'#0a2036');
  b.fillStyle=gr;b.fillRect(0,hor,W*1.8,H-hor);
  b.fillStyle='rgba(255,220,160,.8)';
  for(let i=0;i<70;i++)b.fillRect(Math.random()*W*1.8,hor-1-Math.random()*3,1.5,1.5);
}
function resize(){
  W=innerWidth;H=innerHeight;mf=W<600?.75:1;dpr=Math.min(W<600?1.75:2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);buildBG();
}
function draw(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#0a2036';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(cx+panX,baseY+panY);ctx.scale(zm,zm);ctx.translate(-cx,-baseY);
  ctx.drawImage(bg,-.4*W+.4*W*Math.sin(yaw),0,W*1.8,H);
  const dv=derive(S.q,S.pw);
  // encuadre automático: ajusta la escala y centra el chorro (incluida la deriva del viento)
  let x0=0,x1=0,hm=0;
  for(const m of [1,1.9])traj(dv,m,(x,y)=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y>hm)hm=y;});
  const target=Math.min((W*.94)/Math.max(60,2*Math.max(-x0,x1)+30),(baseY-66)/Math.max(100,hm*1.04));
  s=s?s+(target-s)*.04:target;
  panX=ux;panY=uy;   // arranca con la boquilla en el centro; se puede mover en 2D
  const cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);
  const pj=(x,y,z)=>[cx+(x*cyw+z*syw)*s,baseY-(y*cp+(-x*syw+z*cyw)*sp)*s];
  const face=(col,pts)=>{ctx.fillStyle=col;ctx.beginPath();pts.forEach((c,i)=>{const q=pj(c[0],c[1],c[2]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();ctx.fill();};
  {const x0=-6,x1=260,z0=-4,z1=4,yb=-3;   // pasarela (jetée des Eaux-Vives): caja con barandilla y farolas
   if(cyw>0)face('#16202b',[[x0,0,z0],[x1,0,z0],[x1,yb,z0],[x0,yb,z0]]);
   if(cyw<0)face('#16202b',[[x0,0,z1],[x1,0,z1],[x1,yb,z1],[x0,yb,z1]]);
   if(syw<0)face('#0f161e',[[x0,0,z0],[x0,0,z1],[x0,yb,z1],[x0,yb,z0]]);
   if(syw>0)face('#0f161e',[[x1,0,z0],[x1,0,z1],[x1,yb,z1],[x1,yb,z0]]);
   face('#2b3745',[[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]]);
   ctx.strokeStyle='#0c1218';ctx.lineWidth=1/zm;
   for(const z of [z0,z1]){ctx.beginPath();let q=pj(x0,1.2,z);ctx.moveTo(q[0],q[1]);q=pj(x1,1.2,z);ctx.lineTo(q[0],q[1]);ctx.stroke();}
   for(let x=20;x<=x1;x+=40)for(const z of [z0,z1]){
     const q0=pj(x,0,z),q1=pj(x,5,z);ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.stroke();
     ctx.fillStyle='rgba(255,214,150,.95)';ctx.beginPath();ctx.arc(q1[0],q1[1],1.6/zm,0,6.3);ctx.fill();}
  }
  // espuma en la base
  const fr=8+S.q/30;
  let gr=ctx.createRadialGradient(cx,baseY,0,cx,baseY,fr*2);
  gr.addColorStop(0,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gr;ctx.save();ctx.translate(cx,baseY);ctx.scale(1,Math.max(.2,sp*1.2+.15));ctx.translate(-cx,-baseY);
  ctx.beginPath();ctx.arc(cx,baseY,fr*2,0,6.3);ctx.fill();ctx.restore();
  // partículas
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  const core=new Path2D(),mist=new Path2D(),big=new Path2D(),sc=.05*s;
  for(let i=0;i<N;i++){
    if(!A[i])continue;
    const xr=X[i]*cyw+Z[i]*syw,dd=-X[i]*syw+Z[i]*cyw,sx=cx+xr*s,sy=baseY-(Y[i]*cp+dd*sp)*s;
    const p=M[i]>1.05?big:M[i]>.5?core:mist;
    p.moveTo(sx,sy);p.lineTo(sx-(VX[i]*cyw+VZ[i]*syw)*sc,sy+(VY[i]*cp+(-VX[i]*syw+VZ[i]*cyw)*sp)*sc);
  }
  ctx.strokeStyle='rgba(225,242,255,.30)';ctx.lineWidth=1.3/zm;ctx.stroke(mist);
  const cw=Math.min(3,Math.max(1.8,.45*s))/zm;
  ctx.strokeStyle='rgba(200,230,255,.07)';ctx.lineWidth=cw*3.2;ctx.stroke(core);
  ctx.strokeStyle='rgba(245,252,255,.5)';ctx.lineWidth=cw;ctx.stroke(core);
  ctx.strokeStyle='rgba(255,255,255,.62)';ctx.lineWidth=cw*1.9;ctx.stroke(big);
  // salpicaduras al caer
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(const p of spl){ctx.globalAlpha=p[2]*.8;ctx.beginPath();ctx.ellipse(cx+(p[0]*cyw+p[1]*syw)*s,baseY-(-p[0]*syw+p[1]*cyw)*sp*s,2+3*(1-p[2]),1,0,0,6.3);ctx.fill();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(showPar){
    ctx.setLineDash([7/zm,5/zm]);ctx.lineWidth=1.4/zm;
    for(const [m,col] of [[.2,'rgba(120,220,255,.9)'],[1,'rgba(255,225,120,.95)'],[1.9,'rgba(255,150,90,.9)']]){
      ctx.strokeStyle=col;ctx.beginPath();let f=true;
      traj(dv,m,(x,y,z)=>{const sx=cx+(x*cyw+z*syw)*s,sy=baseY-(y*cp+(-x*syw+z*cyw)*sp)*s;f?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);f=false;});
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  ctx.restore();
  ctx.font='10px system-ui';ctx.textAlign='left';ctx.lineWidth=1;   // regla de altura
  for(let hm=50;hm<=900;hm+=50){const y=baseY+panY-hm*s*zm*cp;if(y<-10)break;if(y>H)continue;
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.moveTo(4,y);ctx.lineTo(hm%100?10:16,y);ctx.stroke();
    if(hm%100===0){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText(hm+' m',20,y+3);}}
  {const bx=W-38,by=56;   // brújula del viento
   ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(bx,by,26,0,6.3);ctx.fill();
   ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.stroke();
   ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('N',bx,by-14);
   const L=wind.v>0?Math.min(1,.25+wind.v/20)*16:0,ax=wind.E*L,ay=-wind.N*L;
   if(L>0){ctx.strokeStyle=ctx.fillStyle='#ffd27a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx-ax*.5,by-ay*.5+3);ctx.lineTo(bx+ax*.5,by+ay*.5+3);ctx.stroke();
    const a=Math.atan2(ay,ax),hx=bx+ax*.5,hy=by+ay*.5+3;
    ctx.beginPath();ctx.moveTo(hx+Math.cos(a)*6,hy+Math.sin(a)*6);ctx.lineTo(hx+Math.cos(a+2.5)*5,hy+Math.sin(a+2.5)*5);ctx.lineTo(hx+Math.cos(a-2.5)*5,hy+Math.sin(a-2.5)*5);ctx.fill();}
   ctx.fillStyle='#fff';ctx.fillText(wind.v.toFixed(1)+' m/s',bx,by+40);}
}
function fmt(id,v){
  const card=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  $('v_'+id).textContent=id==='dir'?v+'° '+card[Math.round(v/22.5)%16]:(id==='turb'?(+v).toFixed(1):v);
}
document.querySelectorAll('input[type=range]').forEach(el=>{
  el.oninput=()=>{T[el.id]=+el.value;fmt(el.id,el.value);};
  fmt(el.id,el.value);
});
$('real').onclick=()=>{const o={q:500,pw:1000,wind:10,dir:270,turb:1,gust:0};
  for(const k in o){$(k).value=o[k];$(k).oninput();}};
$('par').onclick=()=>{showPar=!showPar;$('par').style.opacity=showPar?1:.5;};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'⏸';};
$('fold').onclick=()=>{panel.classList.toggle('folded');$('fold').textContent=panel.classList.contains('folded')?'▴':'▾';buildBG();};
setInterval(()=>{
  const dv=derive(S.q,S.pw);
  $('h_q').textContent=Math.round(S.q)+' L/s';$('h_p').textContent=Math.round(S.pw)+' kW';
  $('h_v').textContent=Math.round(dv.v*3.6)+' km/h';$('h_h').textContent=Math.round(dv.h)+' m';
  $('h_d').textContent=(dv.d*100).toFixed(1)+' cm';
  $('h_m').textContent=(alive*S.q/Math.max(rate,1)/1000).toFixed(1)+' t';
},150);
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(dt>.026)qa=Math.max(.35,qa*.97);else if(dt<.019)qa=Math.min(1,qa+.002);   // adapta partículas al rendimiento
  if(!paused&&dt>0){
    const a=1-Math.exp(-dt/1.5);S.q+=(T.q-S.q)*a;S.pw+=(T.pw-S.pw)*a;   // la bomba responde con inercia
    tm+=dt;const dv=derive(S.q,S.pw);
    rate=Math.min(2300,Math.max(400,1150*S.q/500))*qa*mf;
    acc+=rate*dt;const n=Math.floor(acc);acc-=n;
    emit(n,dv,dt);step(dt,dv);
  }
  draw();requestAnimationFrame(frame);
}
function zoomBy(f,p){const z=Math.min(5,Math.max(.5,zm*f)),fe=z/zm,ox=cx+ux,oy=baseY+uy;
  ux=p[0]-(p[0]-ox)*fe-cx;uy=p[1]-(p[1]-oy)*fe-baseY;zm=z;}
const ptr=new Map();let pd=0;
const pdist=()=>{const a=[...ptr.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=pdist();};
cv.onpointermove=e=>{const o=ptr.get(e.pointerId);if(!o)return;const n=[e.clientX,e.clientY],dx=n[0]-o[0],dy=n[1]-o[1];
  if(ptr.size===1){ux+=dx;uy+=dy;}   // un dedo: mover en 2D (sin girar)
  ptr.set(e.pointerId,n);
  if(ptr.size===2){const d=pdist(),a=[...ptr.values()];if(pd)zoomBy(d/pd,[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]);ux+=dx/2;uy+=dy/2;pd=d;}};
cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);pd=0;};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(-e.deltaY*.0015),[e.clientX,e.clientY]);},{passive:false});
$('zin').onclick=()=>zoomBy(1.25,[W/2,H/2]);$('zout').onclick=()=>zoomBy(.8,[W/2,H/2]);
$('zrst').onclick=()=>{zm=1;ux=0;uy=0;};

if(innerWidth<600){panel.classList.add('folded');$('fold').textContent='▴';}

})();
